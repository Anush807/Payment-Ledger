name: payment-ledger

x-mongo: &mongo
  image: mongo:7.0
  command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 5s
    timeout: 5s
    retries: 20

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.1
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    CLUSTER_ID: payment-ledger-cluster
    # topics are auto-created with the shape the spec asks for
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    KAFKA_NUM_PARTITIONS: 6
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_LOG_RETENTION_HOURS: 168
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
    interval: 10s
    timeout: 10s
    retries: 30

x-service: &service
  build:
    context: ..
    dockerfile: infra/Dockerfile
  environment: &service-env
    KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
    API_KEY: ${API_KEY:-dev-key}
  depends_on:
    mongo-init:
      condition: service_completed_successfully
    kafka-1:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 30

services:
  mongo-1:
    <<: *mongo
    container_name: mongo-1
    ports: ["27017:27017"]
  mongo-2:
    <<: *mongo
    container_name: mongo-2
    ports: ["27018:27017"]
  mongo-3:
    <<: *mongo
    container_name: mongo-3
    ports: ["27019:27017"]

  # initiates the replica set (required for transactions and change streams) and creates app users
  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo-1: {condition: service_healthy}
      mongo-2: {condition: service_healthy}
      mongo-3: {condition: service_healthy}
    volumes:
      - ./mongo:/scripts:ro
    entrypoint: ["bash", "/scripts/init-replica-set.sh"]
    restart: "no"

  kafka-1:
    <<: *kafka
    container_name: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka-1:9092,CONTROLLER://kafka-1:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
    ports: ["19092:19092"]
  kafka-2:
    <<: *kafka
    container_name: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://kafka-2:9092,CONTROLLER://kafka-2:9093,EXTERNAL://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:19093
    ports: ["19093:19093"]
  kafka-3:
    <<: *kafka
    container_name: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://kafka-3:9092,CONTROLLER://kafka-3:9093,EXTERNAL://0.0.0.0:19094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:19094
    ports: ["19094:19094"]

  connect:
    image: debezium/connect:2.7.3.Final
    container_name: connect
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      GROUP_ID: payment-ledger-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PRODUCER_ACKS: all
      CONNECT_PRODUCER_ENABLE_IDEMPOTENCE: "true"
      KAFKA_JMX_PORT: 9999
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 30

  # registers one outbox connector per service, then exits
  connect-init:
    image: curlimages/curl:8.9.0
    depends_on:
      connect: {condition: service_healthy}
    volumes:
      - ./debezium:/connectors:ro
    entrypoint: ["sh", "/connectors/register.sh"]
    restart: "no"

  order-service:
    <<: *service
    container_name: order-service
    ports: ["8081:8080"]
    environment:
      <<: *service-env
      MONGO_URI: mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/order_db?replicaSet=rs0
      SERVICE_JAR: order-service
  wallet-service:
    <<: *service
    container_name: wallet-service
    ports: ["8082:8080"]
    environment:
      <<: *service-env
      MONGO_URI: mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/wallet_db?replicaSet=rs0
      SERVICE_JAR: wallet-service
  payment-service:
    <<: *service
    container_name: payment-service
    ports: ["8083:8080"]
    environment:
      <<: *service-env
      MONGO_URI: mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/payment_db?replicaSet=rs0
      SERVICE_JAR: payment-service
  ledger-service:
    <<: *service
    container_name: ledger-service
    ports: ["8084:8080"]
    environment:
      <<: *service-env
      MONGO_URI: mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/ledger_db?replicaSet=rs0
      SERVICE_JAR: ledger-service
  notification-service:
    <<: *service
    container_name: notification-service
    ports: ["8085:8080"]
    environment:
      <<: *service-env
      MONGO_URI: mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/notification_db?replicaSet=rs0
      SERVICE_JAR: notification-service

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka-1: {condition: service_healthy}
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: payment-ledger
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  # consumer lag per group, scraped by Prometheus
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    depends_on:
      kafka-1: {condition: service_healthy}
    command: ["--kafka.server=kafka-1:9092", "--kafka.server=kafka-2:9092", "--kafka.server=kafka-3:9092"]
    ports: ["9308:9308"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    depends_on: [prometheus]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
