global:
  scrape_interval: 10s

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - order-service:8080
          - wallet-service:8080
          - payment-service:8080
          - ledger-service:8080
          - notification-service:8080
  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]
