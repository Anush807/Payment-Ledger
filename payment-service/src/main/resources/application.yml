spring:
  application:
    name: payment-service
  config:
    import: classpath:common.yml
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/payment_db?replicaSet=rs0}
  kafka:
    consumer:
      group-id: payment-service

server:
  port: ${PORT:8083}

mongock:
  migration-scan-package:
    - com.paymentledger.common.migration
    - com.paymentledger.payment.migration
